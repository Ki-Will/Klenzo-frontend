<!-- Top App Bar -->
<header class="bg-[#131313] shadow-none w-full sticky top-0 z-50 flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-on-surface-variant active:scale-95 transition-transform">close</button>
</div>
<h1 class="font-['Manrope'] tracking-tight font-bold text-2xl font-black tracking-tighter text-[#4F46E5] dark:text-[#C3C0FF]">Klenzoo</h1>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high ring-2 ring-primary/20">

<main class="max-w-md mx-auto px-6 pt-4 pb-32 flex flex-col min-h-[calc(100vh-80px)]">

<section class="flex flex-col items-center justify-center py-8 space-y-2">

<div class="flex items-baseline gap-1">
<span class="text-primary font-headline text-3xl font-bold">$</span>
<span class="text-on-surface font-headline text-6xl font-extrabold tracking-tighter">1,240.00</span>
</div>
<div class="bg-surface-container-low px-4 py-2 rounded-full mt-4 flex items-center gap-2">
<span class="material-symbols-outlined text-sm text-primary">edit_note</span>
<span class="text-on-surface-variant text-sm font-medium">Add note...</span>
</div>
</section>
<!-- Category Horizontal Select -->
<section class="mt-4">
<div class="flex items-center justify-between mb-4">
<h3 class="font-headline font-bold text-lg">Category</h3>
<span class="text-primary text-sm font-medium">View All</span>
</div>
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
<!-- Category Item Active -->
<div class="flex flex-col items-center gap-2 shrink-0">
<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-container to-primary flex items-center justify-center shadow-lg shadow-primary/20">

</div>

</div>

</div>

</div>
<!-- Category Item -->
<div class="flex flex-col items-center gap-2 shrink-0 opacity-60">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">directions_car</span>
</div>

<span class="material-symbols-outlined text-on-surface-variant text-3xl">movie</span>
</div>
<span class="text-xs font-medium text-on-surface-variant">Fun</span>
</div>
<!-- Category Item -->
<div class="flex flex-col items-center gap-2 shrink-0 opacity-60">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">health_and_safety</span>
</div>
<span class="text-xs font-medium text-on-surface-variant">Health</span>
</div>
</div>

<button class="py-4 text-2xl font-headline font-bold text-on-surface active:bg-surface-container-high rounded-xl transition-colors">5</button>
<button class="py-4 text-2xl font-headline font-bold text-on-surface active:bg-surface-container-high rounded-xl transition-colors">6</button>
<button class="py-4 text-2xl font-headline font-bold text-on-surface active:bg-surface-container-high rounded-xl transition-colors">7</button>
<button class="py-4 text-2xl font-headline font-bold text-on-surface active:bg-surface-container-high rounded-xl transition-colors">8</button>
<button class="py-4 text-2xl font-headline font-bold text-on-surface active:bg-surface-container-high rounded-xl transition-colors">9</button>
<button class="py-4 text-2xl font-headline font-bold text-on-surface active:bg-surface-container-high rounded-xl transition-colors">.</button>

<button class="w-full bg-gradient-to-br from-primary-container to-primary text-on-primary font-headline font-extrabold py-5 rounded-full shadow-2xl shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">

<span class="material-symbols-outlined">arrow_forward</span>
</button>

<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Feed</span>

<span class="material-symbols-outlined" data-icon="insights">insights</span>

<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase">Settings</span>
