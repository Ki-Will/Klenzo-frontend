            background: linear-gradient(135deg, #4f46e5 0%, #c3c0ff 100%);

<div class="w-2/3 h-1 bg-primary/20 rounded-full mb-1"></div>
<div class="w-full h-1 bg-primary/40 rounded-full"></div>
</div>
</div>

<h1 class="font-headline font-extrabold text-5xl md:text-6xl text-white leading-tight tracking-tight">
                    Get <span class="text-primary italic">AI</span> insights
                </h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed opacity-90 max-w-[90%]">

                </p>
</div>
</div>
