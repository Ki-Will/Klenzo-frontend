<!DOCTYPE html>

<html class="dark" lang="en"><head>

<title>Klenzoo - Add Expense</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(42, 42, 42, 0.6);
            backdrop-filter: blur(40px);
        }
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen selection:bg-primary/30">
<!-- Top Navigation Bar -->
<header class="bg-neutral-950/80 backdrop-blur-xl fixed top-0 w-full z-50 flex justify-between items-center px-8 h-20 w-full max-w-full tonal-shift bg-neutral-900/50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-neutral-800/50 transition-colors active:scale-95 duration-200 rounded-full text-on-surface">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-manrope tracking-tight text-2xl font-black text-indigo-500 tracking-tighter">Klenzoo</h1>
</div>
<div class="flex items-center gap-6">
<button class="material-symbols-outlined text-neutral-400 hover:bg-neutral-800/50 transition-colors p-2 rounded-full">notifications</button>
<button class="material-symbols-outlined text-neutral-400 hover:bg-neutral-800/50 transition-colors p-2 rounded-full">account_circle</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-32 pb-24 px-6 md:px-12 max-w-7xl mx-auto flex flex-col lg:flex-row gap-12 items-start justify-center">
<!-- Left Column: Amount & Numpad (Visual Focus) -->
<section class="w-full lg:w-1/2 flex flex-col items-center justify-center space-y-12">
<div class="text-center w-full">
<p class="font-headline uppercase tracking-widest text-[10px] text-neutral-500 mb-4">Enter Transaction Amount</p>
<div class="flex items-center justify-center space-x-2">
<span class="text-4xl font-headline font-bold text-primary-container">$</span>
<h2 class="text-7xl md:text-8xl font-headline font-extrabold tracking-tighter text-on-surface">0.00</h2>
</div>
</div>
<!-- Numpad -->
<div class="numpad-grid w-full max-w-md mx-auto">
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">1</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">2</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">3</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">4</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">5</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">6</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">7</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">8</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">9</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">.</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all rounded-lg">0</button>
<button class="aspect-square flex items-center justify-center text-3xl font-headline font-bold text-error hover:bg-error-container/20 active:scale-95 transition-all rounded-lg">
<span class="material-symbols-outlined text-4xl">backspace</span>
</button>
</div>
</section>
<!-- Right Column: Details & Categorization -->
<section class="w-full lg:w-1/2 space-y-8">
<!-- Category Selector -->
<div class="space-y-4">
<label class="font-headline uppercase tracking-widest text-[10px] text-neutral-500 ml-4">Select Category</label>
<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform">restaurant</span>
<span class="text-xs font-medium text-on-surface-variant">Dining</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-indigo-600/10 border border-indigo-600/20 group">
<span class="material-symbols-outlined text-indigo-400 mb-2" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
<span class="text-xs font-bold text-white">Shopping</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform">directions_car</span>
<span class="text-xs font-medium text-on-surface-variant">Travel</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform">bolt</span>
<span class="text-xs font-medium text-on-surface-variant">Utilities</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform">movie</span>
<span class="text-xs font-medium text-on-surface-variant">Fun</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-primary mb-2 group-hover:scale-110 transition-transform">more_horiz</span>
<span class="text-xs font-medium text-on-surface-variant">Other</span>
</button>
</div>
</div>
<!-- Date & Notes -->
<div class="space-y-6">
<div class="space-y-4">
<label class="font-headline uppercase tracking-widest text-[10px] text-neutral-500 ml-4">Date</label>
<div class="flex items-center gap-4 bg-surface-container-low p-5 rounded-lg">
<span class="material-symbols-outlined text-neutral-500">calendar_today</span>
<span class="text-on-surface font-medium">Today, Nov 12, 2024</span>
</div>
</div>
<div class="space-y-4">
<label class="font-headline uppercase tracking-widest text-[10px] text-neutral-500 ml-4">Note / Description</label>
<div class="relative">
<textarea class="w-full bg-surface-container-low border-none rounded-lg p-5 text-on-surface placeholder:text-neutral-600 focus:ring-1 focus:ring-primary-container transition-all resize-none" placeholder="Add a description..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Action Area -->
<div class="pt-8">
<button class="w-full h-16 bg-gradient-to-r from-primary-container to-indigo-700 rounded-full text-white font-headline font-bold text-lg shadow-[0_20px_40px_rgba(79,70,229,0.3)] hover:shadow-[0_25px_50px_rgba(79,70,229,0.5)] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">check_circle</span>
                    Confirm Expense
                </button>
</div>
</section>
</main>
<!-- Side Navigation Bar (Hidden on Mobile) -->
<aside class="fixed left-0 h-full w-64 border-r border-neutral-800/20 bg-neutral-950 hidden lg:flex flex-col p-6 space-y-4">

<nav class="space-y-2 flex-1">

<span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
<a class="flex items-center gap-4 px-4 py-3 text-white bg-indigo-600/10 rounded-xl font-manrope uppercase tracking-widest text-[10px]" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span> Expenses
            </a>
<a class="flex items-center gap-4 px-4 py-3 text-neutral-500 hover:text-indigo-300 hover:bg-neutral-900 transition-all rounded-xl font-manrope uppercase tracking-widest text-[10px]" href="#">
<span class="material-symbols-outlined">group</span> Groups
            </a>
<a class="flex items-center gap-4 px-4 py-3 text-neutral-500 hover:text-indigo-300 hover:bg-neutral-900 transition-all rounded-xl font-manrope uppercase tracking-widest text-[10px]" href="#">
<span class="material-symbols-outlined">insights</span> Analytics
            </a>
<a class="flex items-center gap-4 px-4 py-3 text-neutral-500 hover:text-indigo-300 hover:bg-neutral-900 transition-all rounded-xl font-manrope uppercase tracking-widest text-[10px]" href="#">
<span class="material-symbols-outlined">settings</span> Settings
            </a>
</nav>
<button class="bg-primary-container text-on-primary-container py-4 rounded-xl font-headline font-bold text-xs uppercase tracking-widest">
            Add Expense
        </button>
</aside>
<!-- Bottom Navigation Bar (Visible on Mobile) -->
<nav class="lg:hidden fixed bottom-0 left-0 w-full flex justify-around items-end px-6 pb-8 pt-4 bg-neutral-950/90 backdrop-blur-2xl z-50 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.4)]">
<a class="flex flex-col items-center justify-center text-neutral-500 p-2 hover:text-indigo-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-inter text-[10px] font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-500 p-2 hover:text-indigo-400" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-inter text-[10px] font-medium mt-1">Costs</span>
</a>
<a class="flex flex-col items-center justify-center bg-indigo-600 text-white rounded-full p-3 mb-2 transform -translate-y-2 shadow-[0_0_20px_rgba(79,70,229,0.4)] active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">add_circle</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-500 p-2 hover:text-indigo-400" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-inter text-[10px] font-medium mt-1">Social</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-500 p-2 hover:text-indigo-400" href="#">
<span class="material-symbols-outlined">query_stats</span>
<span class="font-inter text-[10px] font-medium mt-1">Insights</span>
</a>
</nav>
